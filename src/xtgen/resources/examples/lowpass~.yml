# Signal-rate example, portable to every target: float params with min/max.
# The '~' in the filename selects the DSP templates for pd and max; plugin targets drop it.
namespace: my
name: lowpass
params:
  - {name: cutoff,    type: float, min: 20.0, max: 20000.0, initial: 1000.0, desc: "cutoff frequency in Hz"}
  - {name: resonance, type: float, min: 0.0, max: 1.0, initial: 0.2, desc: "resonance at cutoff"}
n_channels: 2
meta:
  desc: |
    A classic resonant two-pole lowpass filter.
  features:
    - cutoff in Hz
    - resonance control
  author: xtgen
  repo: https://github.com/xtgen/lowpass.git
external:
  inlets: [cutoff]
plugin:
  modulated: [cutoff]
