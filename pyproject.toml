[project]
name = "xtgen"
version = "0.2.0"
description = "A modern, type-safe tool to generate skeleton PureData and Max/MSP externals, CLAP/VST3/AUv2 plugins, and VCV Rack modules"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "xtgen contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mako>=1.3.10",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# Compiles a spec's 'dsp' graph (.gdsp) to C: needs compile_graph(lang="c") and
# compile_graph_header(), both new in 0.6.0.
dsp = ["gen-dsp[graph]>=0.6.0"]


[project.scripts]
xtgen = "xtgen.cli:main"


[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "gen-dsp[graph]>=0.6.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.13.1",
    "types-pyyaml>=6.0.12.20250915",
]


[tool.uv.sources]
# Until gen-dsp 0.6.0 is on PyPI; remove this table then.
gen-dsp = { path = "../gen-dsp", editable = true }


[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"
